[package]
name = "plkokoro-cli"
description = "CLI dla biblioteki plkokoro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "plkokoro"
path = "src/main.rs"

[dependencies]
plkokoro = { path = "../plkokoro" }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
log = "0.4"

[features]
# Przekazane do biblioteki (patrz plkokoro/Cargo.toml): włączają providery ONNX Runtime poza CPU.
cuda = ["plkokoro/cuda"]
tensorrt = ["plkokoro/tensorrt"]
rocm = ["plkokoro/rocm"]
migraphx = ["plkokoro/migraphx"]
coreml = ["plkokoro/coreml"]
directml = ["plkokoro/directml"]
openvino = ["plkokoro/openvino"]

[dev-dependencies]
tiny_http = "0.12"
tempfile = "3"
serde_json = "1"
